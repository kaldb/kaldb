x-healthcheck-common: &healthcheck-common
  interval: 5s
  timeout: 5s
  retries: 20

services:
  zookeeper:
    image: zookeeper:3.9
    container_name: dep_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_STANDALONE_ENABLED: "true"
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,stat"

  kafka:
    image: 'bitnamilegacy/kafka:3.2.3'
    container_name: dep_kafka
    ports:
      - '9092:9092'
      - '29092:29092'
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CREATE_TOPICS=test-topic:1:1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      - zookeeper

  grafana:
    image: 'grafana/grafana:8.0.3'
    container_name: dep_grafana
    ports:
      - '3000:3000'
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ../slack-astra-app:/var/lib/grafana/plugins
    environment:
      GF_LOG_MODE: "console file"
      GF_LOG_LEVEL: "info"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_PATHS_PLUGINS: "/var/lib/grafana/plugins"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: "slack-astra-app,slack-astra-app-backend-datasource"

  opensearch:
    image: 'opensearchproject/opensearch:2.11.1'
    container_name: dep_opensearch
    environment:
      - cluster.name=opensearch-local
      - node.name=opensearch-node1
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
    ports:
      - '9200:9200'
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      <<: *healthcheck-common
      start_period: 10s

  opensearch_dashboards:
    image: 'opensearchproject/opensearch-dashboards:2.11.1'
    container_name: dep_opensearch_dashboards
    ports:
      - '5601:5601'
    environment:
      OPENSEARCH_HOSTS: '["http://astra_dashboards_gateway:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      astra_dashboards_gateway:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  astra_dashboards_gateway:
    build:
      context: .
      dockerfile: contrib/dashboards-gateway.Dockerfile
    image: 'kaldb/dashboards-gateway:local'
    container_name: dep_astra_dashboards_gateway
    environment:
      ASTRA_URL: 'http://astra-query:8081'
      OPENSEARCH_URL: 'http://opensearch:9200'
      LISTEN_PORT: '9200'
      MAX_REQUEST_BYTES: '10485760'
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_astra/gateway/health >/dev/null || exit 1"]
      <<: *healthcheck-common
      start_period: 5s
    depends_on:
      - astra_query
      - opensearch

  s3:
    image: 'adobe/s3mock:2.1.29'
    container_name: dep_s3
    environment:
      - initialBuckets=test-s3-bucket

  openzipkin:
    image: 'openzipkin/zipkin-slim'
    container_name: dep_openzipkin
    ports:
      - 9411:9411

  #to build this image run 'docker build -t slackhq/astra .'
  astra_preprocessor:
    image: 'slackhq/astra'
    container_name: astra_preprocessor
    ports:
      - 8086:8086
    environment:
      # Node specific settings
      - NODE_ROLES=PREPROCESSOR
      - ASTRA_PREPROCESSOR_USE_BULK_API=true
      - ASTRA_PREPROCESSOR_SERVER_ADDRESS=astra_preprocessor
      # Shared settings
      - ASTRA_ZK_CONNECTION_STRING=zookeeper:2181
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ZIPKIN_TRACING_ENDPOINT=http://openzipkin:9411/api/v2/spans
      - S3_ENDPOINT=http://s3:9090
    depends_on:
      - zookeeper
      - kafka
      - s3
      - openzipkin

  astra_index:
    image: 'slackhq/astra'
    container_name: astra_index
    ports:
      - 8080:8080
    environment:
      # Node specific settings
      - NODE_ROLES=INDEX
      - ASTRA_INDEX_SERVER_ADDRESS=astra_index
      - INDEXER_MAX_MESSAGES_PER_CHUNK=${INDEXER_MAX_MESSAGES_PER_CHUNK:-1000000}
      - INDEXER_MAX_BYTES_PER_CHUNK=${INDEXER_MAX_BYTES_PER_CHUNK:-1000000000}
      - INDEXER_MAX_TIME_PER_CHUNK_SECONDS=${INDEXER_MAX_TIME_PER_CHUNK_SECONDS:-86400}
      - INDEXER_CREATE_RECOVERY_TASKS_ON_START=false
      # Shared settings
      - ASTRA_ZK_CONNECTION_STRING=zookeeper:2181
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ZIPKIN_TRACING_ENDPOINT=http://openzipkin:9411/api/v2/spans
      - S3_ENDPOINT=http://s3:9090
    depends_on:
      - astra_preprocessor
    networks:
      default:
        aliases:
          - astra-index

  astra_manager:
    image: 'slackhq/astra'
    container_name: astra_manager
    ports:
      - 8083:8083
    environment:
      # Node specific settings
      - NODE_ROLES=MANAGER
      - ASTRA_MANAGER_SERVER_ADDRESS=astra_manager
      # Shared settings
      - ASTRA_ZK_CONNECTION_STRING=zookeeper:2181
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ZIPKIN_TRACING_ENDPOINT=http://openzipkin:9411/api/v2/spans
      - S3_ENDPOINT=http://s3:9090
    depends_on:
      - astra_preprocessor

  astra_query:
    image: 'slackhq/astra'
    container_name: astra_query
    ports:
      - 8081:8081
    environment:
      # Node specific settings
      - NODE_ROLES=QUERY
      - ASTRA_QUERY_SERVER_ADDRESS=astra_query
      - ASTRA_MANAGER_CONNECTION_STRING=astra_manager:8083
      # Shared settings
      - ASTRA_ZK_CONNECTION_STRING=zookeeper:2181
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ZIPKIN_TRACING_ENDPOINT=http://openzipkin:9411/api/v2/spans
      - S3_ENDPOINT=http://s3:9090
    depends_on:
      - astra_preprocessor
    networks:
      default:
        aliases:
          - astra-query

  astra_cache:
    image: 'slackhq/astra'
    container_name: astra_cache
    ports:
      - 8082:8082
    environment:
      # Node specific settings
      - NODE_ROLES=CACHE
      - ASTRA_CACHE_SERVER_ADDRESS=astra_cache
      # Shared settings
      - ASTRA_ZK_CONNECTION_STRING=zookeeper:2181
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ZIPKIN_TRACING_ENDPOINT=http://openzipkin:9411/api/v2/spans
      - S3_ENDPOINT=http://s3:9090
    depends_on:
      - astra_preprocessor

  astra_recovery:
    image: 'slackhq/astra'
    container_name: astra_recovery
    ports:
      - 8085:8085
    environment:
      # Node specific settings
      - NODE_ROLES=RECOVERY
      - ASTRA_RECOVERY_SERVER_ADDRESS=astra_recovery
      # Shared settings
      - ASTRA_ZK_CONNECTION_STRING=zookeeper:2181
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ZIPKIN_TRACING_ENDPOINT=http://openzipkin:9411/api/v2/spans
      - S3_ENDPOINT=http://s3:9090
    depends_on:
      - astra_preprocessor

volumes:
  opensearch-data1:
